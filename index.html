<!DOCTYPE html>
<html>

<head>
    <title>GPU</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>

<body>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>

        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();


        const camera = new THREE.PerspectiveCamera(
            65,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(5, 3, 10);
        camera.lookAt(0, 0, 0);


       

const axesHelper = new THREE.AxesHelper(5);
scene.add(axesHelper);




const plane_vertices = [
    -1,  -1,  0,
    1,  -1,  0,
    1,  1,  0,

    -1,  1,  0,
    -1,  -1,  0,
    1,  1,  0,

    -1, 1,   0,
     1, 1,  -1,
    -1, 1,  -1,
    
];


const angle = THREE.MathUtils.degToRad(-90);
const cos = Math.cos(angle);
const sin = Math.sin(angle);

const rotationX90 = new THREE.Matrix4();
rotationX90.set(
1, 0, 0, 0,
0, cos, -sin, 0,
0, sin, cos, 0,
0, 0, 0, 1
);

const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
       // geometry.addlyMatrix4(rotationX90);
        geometry.computeVertexNormals();

        const myObj = new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({ color: 0xffffff }));
        myObj.position.set(0, 0, 0);
        myObj.castShadow = true;
        scene.add(myObj);

 //Light
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(1, 1, 1);
        scene.add(light);
const loader = new THREE.OBJLoader();
        loader.load("https://github.com/JAmeTagalian/jametaglian.github.io/blob/main/myModel%20(2).obj", function (obj) {
        obj.position.set(1,0,0);
            scene.add(obj);
        });

    
const controls = new THREE.OrbitControls(camera, renderer.domElement);
function animate(t) {
    myObj.rotation.y = t * 0.001;
   
    renderer.render(scene, camera);
    requestAnimationFrame(animate);
}
animate(0);



    </script>
</body>

</html>
